[package]
name = "dlssg-patcher"
version = "0.1.1"
edition = "2024"
description = "Simple GUI for the dlssg_for_sm86 Frame Generation mod (RTX 20/30-series GPUs)"
license = "MIT"
authors = ["sds-228"]
readme = "README.md"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = "3.4.2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
